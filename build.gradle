plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version "${mdg_legacy_version}"
}

base {
    version = "${mod_version}"
    group = "${mod_package}"
    archivesName = "${mod_name}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
    maven {
        name 'CurseMaven'
        url 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name 'Modrinth'
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name 'SpongePowered'
        url 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven { // LDLib
        name = "FirstDarkDev Maven"
        url = "https://maven.firstdarkdev.xyz/snapshots"
        content {
            includeGroup("com.lowdragmc.ldlib")
        }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.+'

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    modImplementation "maven.modrinth:architectury-api:${architectury_version}"

    // FTB
    modImplementation("curse.maven:ftb-library-forge-404465:${ftb_library_file_id}") { transitive = false }
    modImplementation("curse.maven:ftb-teams-forge-404468:${ftb_teams_file_id}") { transitive = false }

    // KJS
    modImplementation "maven.modrinth:rhino:${rhino_version}"
    modImplementation "maven.modrinth:kubejs:${kubejs_version}"

    // EMI
    modImplementation "maven.modrinth:emi:${emi_version}"

    // GTM
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mixin {
    var refMap = add sourceSets.main, "${mod_id}.refmap.json"
    jar.from refMap
    config "${mod_id}.mixins.json"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'INFO'
        }

        client {
            client()
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    Map<String, Object> replaceProperties = [
            'mod_id'              : "${mod_id}",
            'mod_name'            : "${mod_name}",
            'mod_version'         : "${mod_version}",
            'mod_license'         : "${mod_license}",
            'mod_description'     : "${mod_description}",
            'mod_authors'         : "${mod_authors}",
            'mod_url'             : "${mod_url}",
            'minecraft_version'   : "${minecraft_version}",
            'loader_version_range': "${loader_version_range}"
    ]

    inputs.properties(replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(replaceProperties)
    }
}

tasks.withType(Jar).configureEach {
    manifest.attributes([
            "Specification-Title"     : "${mod_id}",
            "Specification-Vendor"    : "${mod_authors}",
            "Specification-Version"   : "1",
            "Implementation-Title"    : "${mod_name}",
            "Implementation-Version"  : "${mod_version}",
            "Implementation-Vendor"   : "${mod_authors}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "${mod_id}.mixins.json"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
